name: Continuous Deployment

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@0.9.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  publish-npm-binaries:
    name: Publish NPM packages
    needs: rust-test
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: linux-x64-glibc,
              OS: ubuntu-22.04,
              TOOLCHAIN: stable,
              TARGET: x86_64-unknown-linux-gnu,
            }
          - {
              NAME: linux-arm64-glibc,
              OS: ubuntu-22.04,
              TOOLCHAIN: stable,
              TARGET: aarch64-unknown-linux-gnu,
            }
          - {
              NAME: win32-x64-msvc,
              OS: windows-2022,
              TOOLCHAIN: stable,
              TARGET: x86_64-pc-windows-msvc,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: windows-2022,
              TOOLCHAIN: stable,
              TARGET: aarch64-pc-windows-msvc,
            }
          - {
              NAME: darwin-x64,
              OS: macos-14,
              TOOLCHAIN: stable,
              TARGET: x86_64-apple-darwin,
            }
          - {
              NAME: darwin-arm64,
              OS: macos-14,
              TOOLCHAIN: stable,
              TARGET: aarch64-apple-darwin,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.build.TOOLCHAIN }}
          targets: ${{ matrix.build.TARGET }}

      - name: Build
        run: cargo build --release --target ${{ matrix.build.TARGET }}

      - name: Prepare release artifacts
        shell: bash
        run: |
          cd target/${{ matrix.build.TARGET }}/release
          BIN_NAME=cuid2gen
          if [ "${{ matrix.build.OS }}" = "windows-2022" ]; then
            BIN_NAME=${BIN_NAME}.exe
          fi
          if [ "${{ matrix.build.OS }}" = "windows-2022" ]; then
            7z a ../../cuid2gen-${{ matrix.build.NAME }}.zip $BIN_NAME
            cd ../..
            sha256sum cuid2gen-${{ matrix.build.NAME }}.zip > cuid2gen-${{ matrix.build.NAME }}.zip.sha256
          else
            tar czf ../../cuid2gen-${{ matrix.build.NAME }}.tar.gz $BIN_NAME
            cd ../..
            sha256sum cuid2gen-${{ matrix.build.NAME }}.tar.gz > cuid2gen-${{ matrix.build.NAME }}.tar.gz.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.build.NAME }}
          path: |
            target/cuid2gen-${{ matrix.build.NAME }}.*
          retention-days: 1

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUILD_NAME: ${{ matrix.build.NAME }}
          BUILD_OS: ${{ matrix.build.OS }}
          BUILD_TARGET: ${{ matrix.build.TARGET }}
        run: |
          cd npm
          bin="cuid2gen"
          node_os=$(echo "$BUILD_NAME" | cut -d '-' -f1)
          export node_os
          node_arch=$(echo "$BUILD_NAME" | cut -d '-' -f2)
          export node_arch
          export node_version="${{ env.RELEASE_VERSION }}"
          if [ "$BUILD_OS" = "windows-2022" ]; then
            export node_pkg="${bin}-windows-${node_arch}"
          else
            export node_pkg="${bin}-${node_os}-${node_arch}"
          fi
          mkdir -p "${node_pkg}/bin"
          cp ../README.md "${node_pkg}/README.md"
          envsubst < package.json.tmpl > "${node_pkg}/package.json"
          if [ "$BUILD_OS" = "windows-2022" ]; then
            bin="${bin}.exe"
          fi
          cp "../target/${BUILD_TARGET}/release/${bin}" "${node_pkg}/bin"
          cd "${node_pkg}"
          npm publish --access public

  publish-npm-base:
    name: Publish the base NPM package
    needs: publish-npm-binaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish the package
        shell: bash
        run: |
          cd npm/cuid2gen
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [publish-npm-binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release notes
        run: |
          echo "## Changes" > release_notes.md
          echo "- See commit history for changes" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "npm install -g cuid2gen" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Binary Checksums" >> release_notes.md
          echo '```' >> release_notes.md
          cat artifacts/release-artifacts-*/cuid2gen-*.sha256 >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF:11}
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            artifacts/release-artifacts-*/cuid2gen-*
